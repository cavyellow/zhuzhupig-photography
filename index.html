<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZhuzhuPig Private V2.2 · 离线预览</title>
<style>
:root{--bg:#f3f1ec;--paper:#fffdf8;--ink:#171715;--muted:#77736b;--line:#ddd9d0;--soft:#e9e6de;--blue:#2863df;--r:18px;font-family:Arial,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-width:320px}button,input,select{font:inherit}button{cursor:pointer}.top{height:66px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,4vw,42px);background:rgba(243,241,236,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-family:Georgia;font-size:20px}.brand b{display:block}.brand small{display:block;font-size:10px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:7px;align-items:center}.pill,.primary{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 11px}.primary{background:#111;color:white}.role{font-size:10px;padding:6px 8px;border-radius:999px;background:#111;color:#fff}.shell{min-height:100vh}.hero,.section{width:min(1100px,calc(100% - 28px));margin:auto}.hero{padding:58px 0 46px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted)}h1,h2,h3{font-family:Georgia,"Songti SC",serif}.hero h1{font-size:clamp(48px,7vw,78px);line-height:.9;letter-spacing:-.05em;margin:12px 0 0}.hero p{color:#5d5951;line-height:1.7}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h2{font-size:32px;margin:6px 0 0}.search{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 12px}.tags{display:flex;gap:6px;overflow:auto;padding:14px 0}.tag{border:0;background:transparent;padding:7px 10px;border-radius:999px;color:var(--muted);white-space:nowrap}.tag.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.cover{aspect-ratio:4/5;position:relative;background:var(--g);overflow:hidden}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 45%,rgba(0,0,0,.12))}.cover-copy{position:absolute;z-index:2;left:14px;top:13px;color:#fff}.cover-copy b{display:block}.cover-copy small{font-size:10px}.card-info{display:flex;justify-content:space-between;align-items:center;padding:12px}.card-info h3{font-size:17px;margin:0}.card-info p{font-size:10px;color:var(--muted);margin:3px 0}.status{font-size:9px;padding:5px 7px;border-radius:999px;background:#222;color:#fff}.status.public{background:var(--blue)}.empty{border:1px dashed var(--line);padding:42px;border-radius:var(--r);text-align:center;color:var(--muted)}.manage{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 66px)}.side{padding:24px 14px;border-right:1px solid var(--line)}.side h3{margin:0 8px 16px}.side button{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:10px}.side button.active{background:var(--soft)}.main{padding:30px clamp(14px,3vw,36px)}.libhead{display:flex;justify-content:space-between;align-items:end;gap:16px}.libhead h1{font-size:40px;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.stats div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}.stats b{font-size:25px;font-family:Georgia}.stats span{display:block;font-size:9px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;gap:10px;margin:18px 0}.seg{display:flex;background:var(--soft);padding:3px;border-radius:999px}.seg button{border:0;background:transparent;padding:7px 10px;border-radius:999px}.seg .active{background:#fff}.folder{aspect-ratio:1.5;background:linear-gradient(135deg,#7b7f82,#d8cbb4);display:flex;align-items:flex-end;padding:12px;color:#fff}.card-actions{display:flex;gap:5px}.card-actions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 8px;font-size:9px}.album{background:#111;color:#f5f1e9;min-height:100vh}.album .top{background:rgba(17,17,17,.9);border-color:#292929;color:#fff}.albumIntro{width:min(1080px,calc(100% - 28px));margin:auto;padding:54px 0 34px;display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:end}.albumIntro h1{font-size:clamp(52px,9vw,92px);line-height:.88;margin:12px 0}.albumIntro p{color:#aaa;line-height:1.7}.gallerybar{position:sticky;top:66px;z-index:15;background:rgba(17,17,17,.94);border-top:1px solid #292929;border-bottom:1px solid #292929;padding:9px clamp(8px,3vw,26px);display:flex;justify-content:space-between;gap:10px;align-items:center}.gallerytools{display:flex;gap:6px;overflow:auto}.gallerytools button{border:1px solid #383838;background:#202020;color:#ddd;border-radius:999px;padding:7px 9px;white-space:nowrap}.gallerytools button.active{background:#eee;color:#111}.photos{width:min(1280px,calc(100% - 12px));margin:10px auto}.photos.masonry{columns:3;column-gap:7px}.photo{height:auto;aspect-ratio:var(--ratio);background:var(--g);margin:0 0 7px;break-inside:avoid;border-radius:2px}.photos.thumb{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.photos.thumb .photo{aspect-ratio:1;margin:0}.photos.full{display:grid;grid-template-columns:1fr;gap:14px;width:min(900px,calc(100% - 20px))}.modalbg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.56);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px}.modal{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--paper);border-radius:22px;padding:22px}.modalhead{display:flex;justify-content:space-between}.modalhead h2{margin:4px 0 18px}.close{border:0;background:#111;color:#fff;border-radius:50%;width:36px;height:36px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:10px;font-weight:bold}.form input,.form select{width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:10px}.span2{grid-column:1/-1}.note{padding:10px;border:1px solid var(--line);background:#f7f4ee;border-radius:10px;color:var(--muted);font-size:10px;line-height:1.6}.uploadzone{border:1.5px dashed #aaa;border-radius:16px;padding:34px;text-align:center;background:#f8f5ef}.progress{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;width:66%;background:var(--blue)}.hidden{display:none!important}@media(max-width:720px){.top{height:60px;padding:0 10px}.brand small,.role{display:none}.actions .pill{font-size:9px;padding:7px 9px}.hero{grid-template-columns:1fr;padding:42px 0 34px}.hero h1{font-size:clamp(42px,13vw,54px)}.head{align-items:flex-start;flex-direction:column}.search{width:100%}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.cover{aspect-ratio:3/4}.card-info{padding:9px}.manage{display:block}.side{display:none}.main{padding:20px 10px}.libhead{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:center}.albumIntro{grid-template-columns:1fr;padding:40px 0 26px}.albumIntro h1{font-size:clamp(48px,15vw,64px)}.gallerybar{top:60px;align-items:flex-start;flex-direction:column}.gallerytools{width:100%}.photos.masonry{columns:2;column-gap:5px}.photo{margin-bottom:5px}.photos.thumb{grid-template-columns:repeat(3,1fr);gap:3px}.modalbg{align-items:end;padding:0}.modal{width:100%;border-radius:22px 22px 0 0;max-height:92vh}.form{grid-template-columns:1fr}.span2{grid-column:auto}}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');let role='visitor',view='home',gallery='masonry',libView='cards';
const albums=[
 {id:1,title:'东京夜行',sub:'Tokyo · 2026',count:38,vis:'public',g:'linear-gradient(145deg,#1c2430,#b68155 55%,#17181a)'},
 {id:2,title:'春日梦境',sub:'Portrait · 2026',count:24,vis:'unlisted',g:'linear-gradient(145deg,#8e9b78,#ead8bf 58%,#6c735e)'},
 {id:3,title:'海边白日梦',sub:'Travel · 2026',count:41,vis:'password',g:'linear-gradient(145deg,#6e9bb6,#e3d4b9 60%,#5f6a68)'},
 {id:4,title:'私人生活',sub:'Private archive',count:72,vis:'private',g:'linear-gradient(145deg,#2a2527,#82676c 55%,#171719)'},
];
const visLabel=v=>({public:'公开',unlisted:'仅链接',password:'口令',private:'私密'})[v];
function navTop(dark=false){return `<div class="top"><div class="brand"><span class="avatar">Z</span><span><b>ZhuzhuPig · Photography</b><small>${view==='manage'?'私人云图库 · 管理后台':'私人摄影档案馆'}</small></span></div><div class="actions"><span class="role">${role==='admin'?'管理员':'访客'}</span>${view!=='home'?`<button class="pill" onclick="setView('home')">公开主页</button>`:''}<button class="pill" onclick="toggleRole()">${role==='admin'?'退出管理员':'管理员登录'}</button>${role==='admin'&&view==='home'?`<button class="primary" onclick="setView('manage')">管理云图库</button>`:''}</div></div>`}
function toggleRole(){role=role==='admin'?'visitor':'admin';view=role==='admin'?'manage':'home';render()}
function setView(v){view=v;render()}
function card(a,admin=false){return `<div class="card" onclick="openAlbum(${a.id})"><div class="cover" style="--g:${a.g}"><div class="cover-copy"><b>${a.title}</b><small>${a.count} 张照片</small></div>${admin?`<span class="status ${a.vis}" style="position:absolute;z-index:2;right:9px;bottom:9px">${visLabel(a.vis)}</span>`:''}</div><div class="card-info"><div><h3>${a.title}</h3><p>${a.sub}</p></div>${admin?`<div class="card-actions"><button onclick="event.stopPropagation();showSettings(${a.id})">设置</button><button onclick="event.stopPropagation();showShare(${a.id})">分享</button></div>`:'→'}</div></div>`}
function home(){const pubs=albums.filter(a=>a.vis==='public');app.innerHTML=`<div class="shell">${navTop()}<section class="hero"><div><span class="eyebrow">ZHUZHUPIG / PHOTO ARCHIVE</span><h1>把照片收好，<br>把作品分享出去。</h1></div><div><p>访客只看到明确设为公开的图册。仅链接、口令、私密图册不会出现在主页。</p><div class="meta"><span>${pubs.length} 个公开图册</span><span>${pubs.reduce((n,a)=>n+a.count,0)} 张作品</span><span>访客模式</span></div></div></section><section class="section"><div class="head"><div><span class="eyebrow">PUBLIC ALBUMS</span><h2>公开作品</h2></div><input class="search" placeholder="搜索公开作品"></div><div class="tags"><button class="tag active">全部 ${pubs.length}</button><button class="tag">旅行 1</button><button class="tag">城市 1</button></div><div class="grid">${pubs.map(a=>card(a)).join('')}</div></section></div>`}
function manage(){app.innerHTML=`<div class="shell">${navTop()}<div class="manage"><aside class="side"><h3>云图库</h3><button class="active">全部文件</button><button>⌁ 2026</button><button style="padding-left:28px">⌁ 日本</button><button>⌁ 客户项目</button><button style="padding-left:28px">⌁ Client A</button></aside><main class="main"><div class="libhead"><div><span class="eyebrow">PRIVATE LIBRARY</span><h1>全部文件</h1><div class="meta">2 个文件夹 · 4 个图册</div></div><div class="actions"><button class="pill" onclick="showUpload(true)">⇧ 批量导入文件夹</button><button class="primary" onclick="showUpload(false)">＋ 新建图册</button></div></div><div class="stats"><div><b>4</b><span>文件夹</span></div><div><b>4</b><span>图册</span></div><div><b>175</b><span>照片</span></div><div><b>3</b><span>非公开图册</span></div></div><div class="toolbar"><input class="search" placeholder="搜索当前目录"><div class="seg"><button class="${libView==='cards'?'active':''}" onclick="libView='cards';render()">缩略图</button><button class="${libView==='list'?'active':''}" onclick="libView='list';render()">列表</button></div></div><div class="eyebrow" style="margin:18px 0 10px">文件夹</div><div class="grid"><div class="card"><div class="folder">2026 / 日本</div><div class="card-info"><div><h3>日本</h3><p>2 个图册</p></div>→</div></div><div class="card"><div class="folder" style="background:linear-gradient(135deg,#6b5c58,#c8b69e)">客户项目</div><div class="card-info"><div><h3>Client A</h3><p>1 个图册</p></div>→</div></div></div><div class="eyebrow" style="margin:24px 0 10px">图册</div><div class="grid">${albums.map(a=>card(a,true)).join('')}</div></main></div></div>`}
function openAlbum(id){window.currentAlbum=albums.find(a=>a.id===id);view='album';render()}
function album(){const a=window.currentAlbum||albums[0],ratios=['3/2','2/3','1/1','4/3','3/4','16/9','5/4','4/5','3/2','2/3','1/1','4/3'],colors=['linear-gradient(145deg,#1b2430,#9e6c4d)','linear-gradient(145deg,#6e808a,#c8b899)','linear-gradient(145deg,#897461,#d4b894)','linear-gradient(145deg,#35414c,#8e9489)','linear-gradient(145deg,#38483d,#b6a077)','linear-gradient(145deg,#233143,#a66f4d)'];app.innerHTML=`<div class="album">${navTop(true)}<section class="albumIntro"><div><span class="eyebrow">${a.sub}</span><h1>${a.title}</h1><span class="status ${a.vis}">${visLabel(a.vis)}</span></div><div><p>这是单图册分享页。访客只获得当前图册权限；默认仅加载 Web 预览图，不直接暴露原图。</p><div class="meta"><span>${a.count} 张照片</span><span>${role==='admin'?'管理员可管理':'访客只读'}</span></div></div></section><div class="gallerybar"><span>${a.count} 张照片</span><div class="gallerytools"><button class="${gallery==='masonry'?'active':''}" onclick="gallery='masonry';render()">流式</button><button class="${gallery==='thumb'?'active':''}" onclick="gallery='thumb';render()">缩略图</button><button class="${gallery==='full'?'active':''}" onclick="gallery='full';render()">大图</button>${role==='admin'?`<button onclick="showUpload(false)">＋照片</button><button onclick="showSettings(${a.id})">隐私设置</button>`:`<button onclick="showShare(${a.id})">分享</button>`}</div></div><div class="photos ${gallery}">${ratios.map((r,i)=>`<div class="photo" style="--ratio:${r};--g:${colors[i%colors.length]}"></div>`).join('')}</div></div>`}
function showSettings(id){const a=albums.find(x=>x.id===id);modal(`<div class="modalhead"><div><span class="eyebrow">ALBUM SETTINGS</span><h2>图册与隐私设置</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>图册名称<input value="${a.title}"></label><label>拍摄信息<input value="${a.sub}"></label><label class="span2">访问权限<select id="pv"><option ${a.vis==='private'?'selected':''}>完全私密</option><option ${a.vis==='unlisted'?'selected':''}>仅链接</option><option ${a.vis==='password'?'selected':''}>访问口令</option><option ${a.vis==='public'?'selected':''}>公开展示</option></select></label><div class="note span2">仅链接：不出现在主页；只有当前链接可以访问。重新生成分享链接后，旧链接立即失效。</div><label>分享过期时间<input type="datetime-local"></label><label>原图下载<select><option>禁止访客下载</option><option>允许访客下载</option></select></label><label class="span2">访问口令<input type="password" placeholder="仅口令图册需要"></label><button class="primary span2" onclick="closeModal()">保存设置</button></div>`)}
function showShare(id){const a=albums.find(x=>x.id===id);modal(`<div class="modalhead"><div><span class="eyebrow">SHARE</span><h2>分享图册</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="note"><b>${visLabel(a.vis)}</b><br>${a.vis==='public'?'公开主页可见。':a.vis==='unlisted'?'主页隐藏，拿到链接的人可看。':a.vis==='password'?'需要链接 + 访问口令。':'完全私密，外部不可访问。'}</div><div style="margin:14px 0;padding:11px;background:#f4f1eb;border-radius:10px;font-size:10px;overflow:auto">https://photo.zhuzhupig.com/album/6a9f…</div><div class="actions"><button class="primary" ${a.vis==='private'?'disabled':''}>复制分享链接</button>${role==='admin'?`<button class="pill">使旧链接失效</button>`:''}</div>`)}
function showUpload(folder){modal(`<div class="modalhead"><div><span class="eyebrow">${folder?'FOLDER IMPORT':'UPLOAD'}</span><h2>${folder?'批量导入文件夹':'上传照片'}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="uploadzone"><b>${folder?'选择整个电脑文件夹':'选择照片或照片文件夹'}</b><p style="color:var(--muted);font-size:11px">${folder?'自动生成 一级目录 → 二级目录 → 图册':'支持多选、重复文件自动跳过、失败重试'}</p></div><div class="progress"><i></i></div><div class="meta"><span>68 / 102</span><span>成功 65 · 重复 2 · 失败 1</span></div><div class="actions" style="margin-top:14px"><button class="primary" onclick="closeModal()">继续上传</button><button class="pill" onclick="closeModal()">停止</button></div>`)}
function modal(html){const d=document.createElement('div');d.id='modal';d.className='modalbg';d.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(d)}function closeModal(){document.getElementById('modal')?.remove()}
function render(){if(view==='home')home();else if(view==='manage')manage();else album()}render();
</script>
</body></html>
