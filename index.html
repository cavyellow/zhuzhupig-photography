otography</b></div></header><section class="hero"><div><span class="eyebrow">PHOTOGRAPHY / Vegetable Pig</span><h1>猪猪大宝贝，<br>把美好摄影分享出去。</h1></div><div><p class="multiline">这是我的摄影作品集。</p></div></section><section class="section"><div class="head"><h2>摄影作品</h2></div><div class="empty" role="status">正在加载图册…</div></section></div><script>(function publicRenderer(initial) {
  'use strict';
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const app = document.getElementById('app'); let query = '', mode = 'masonry', page = 0;
  const NAV = 'zhuzhuPortfolioNavigation';
  const baseUrl = location.href.split('#')[0];
  let rendered = '', activeAlbum = null, overlay = null, refreshGrid = null, homeScroll = 0;
  const albumViews = new Map();

  const PAGE_SIZE = 60;
  initial.folders ||= [];
  const homepage=initial.homepage||{eyebrow:'PHOTOGRAPHY / SELECTED WORKS',headline:'把照片收好，\n把作品分享出去。',sectionTitle:'摄影作品',footer:initial.title};
  let activeFolder=null;const browseViews=new Map();
  function chain(id){const result=[],seen=new Set();while(id&&!seen.has(id)){seen.add(id);const f=initial.folders.find(f=>f.id===id);if(!f)break;result.unshift(f);id=f.parentId;}return result;}
  function albumChain(id){const path=[],seen=new Set();while(id&&!seen.has(id)){seen.add(id);const a=initial.albums.find(x=>x.id===id);if(!a)break;path.unshift(a);id=a.parentId;}return path;}
  function title(p,index){return p.title||`作品 ${index+1}`;}
  function cover(a){if(a.cover)return a.cover;for(const child of initial.albums.filter(x=>x.parentId===a.id)){const result=cover(child);if(result)return result;}return null;}
  function albumCrumbs(a){const path=albumChain(a.id);return crumbs(path[0]?.folderId)+`<nav class="breadcrumbs" aria-label="图册路径">${path.map(x=>`<button class="pill" data-path="/album/${x.id}">${esc(x.title)}</button>`).join('<span> / </span>')}</nav>`;}
  function childCard(a){const image=cover(a);return `<figure class="photo album-folder" data-child-album="${a.id}" style="--ratio:4/3" tabindex="0" role="link" aria-label="进入子图册：${esc(a.title)}"><div class="photo-media">${image?`<img src="${image}" alt="${esc(a.title)}" loading="lazy" decoding="async">`:'<div class="folder-placeholder" aria-hidden="true">▣</div>'}<span class="folder-badge">▣ 子图册</span></div><figcaption><span>${esc(a.title)}</span><span class="folder-enter" aria-hidden="true">进入 →</span></figcaption></figure>`;}
  function folderPath(id){return id?`/folder/${id}`:'/';}
  function crumbs(id){return `<nav class="breadcrumbs" aria-label="目录路径"><button class="pill return-button" data-path="/">作品首页</button>${chain(id).map(f=>`<span> / </span><button class="pill" data-path="/folder/${f.id}">${esc(f.name)}</button>`).join('')}</nav>`;}
  function returnTo(path){rememberView();const entry=ownEntry();if(entry?.parent===path)history.back();else navigate(path);}
  function bindCrumbs(){app.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>b.dataset.path==='/'?returnHome():returnTo(b.dataset.path));}

  document.title = initial.title;
  function currentPath() { return location.hash.slice(1) || '/'; }
  function ownEntry() {
    const entry = history.state?.[NAV];
    return entry?.version === 1 && entry.baseUrl === baseUrl && entry.path === currentPath() ? entry : null;
  }
  function stateFor(path, parent, depth, view = null) {
    return { [NAV]: { version:1, baseUrl, path, parent, depth, view } };
  }
  function rememberView() {
    if (!activeAlbum) { homeScroll = scrollY; browseViews.set(folderPath(activeFolder),{query,scroll:scrollY}); }

    const entry = ownEntry();

  }
  function navigate(path, replace = false) {
    if (currentPath() === path) return;
    rememberView();
    const old = ownEntry();
    const next = replace && old ? { ...old, path } : { version:1, baseUrl, path, parent:currentPath(), depth:(old?.depth || 0)+1, view:null };
    history[replace ? 'replaceState' : 'pushState']({ [NAV]:next }, '', baseUrl + '#' + path);
    route();
  }
  function returnHome() {
